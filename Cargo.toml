[package]
name = "pkg_parser"
version = "1.2.0"
edition = "2024"
description = "A parser for Wallpaper Engine pkg, tex, mdl and video files"
license = "GPL-3.0"

[features]
default = ["ffmpeg"]
# Enables the ffmpeg-backed video decoder.  Turning it off keeps the crate
# free of any native dependency, which is what the browser (wasm) build
# needs: there the GIF backend (pure Rust) and user supplied backends are
# used instead.
ffmpeg = ["dep:ffmpeg-next"]

[dependencies]
ahash = "0.8.12"
bcndecode = "0.2.0"
ffmpeg-next = { version = "9.0", optional = true }
hashbrown = "0.15.5"
image = "0.25.9"
log = "0.4"
lz4_flex = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.release]
debug = false
strip = true
lto = "thin"
panic = "abort"
codegen-units = 1
